name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of every month
  workflow_dispatch: # Manual trigger

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # Re-enabling a workflow via the API resets GitHub's 60-day
      # inactivity timer that auto-disables scheduled workflows.
      - name: Reset scheduled workflow timers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily-prices.yml/enable
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
          echo "Workflows re-enabled at $(date -u)"
